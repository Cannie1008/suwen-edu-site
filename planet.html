<style>
:root{--paper:#F0EEE6;--surface:#FAF9F5;--card:#FFFFFF;--ink:#141413;--muted:#6F6E68;--faint:#9C9A8F;

--sans:"ui-sans-serif",-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
--serif:"Tiempos Headline",Georgia,"Songti SC","Times New Roman",serif;}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 50px}
.kick{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral-d);font-weight:600;margin-bottom:8px}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.12;margin:0 0 7px}
.lead{color:var(--muted);font-size:13.5px;margin:0;max-width:760px}
.stage{display:grid;grid-template-columns:1fr 380px;gap:26px;align-items:start;margin-top:18px}
.globe{position:relative;background:radial-gradient(circle at 50% 42%,#F7F5EF 0%,#F0EEE6 62%,#EAE7DD 100%);border-radius:18px;border:1px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;height:auto;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.gov{position:absolute;left:16px;top:14px;font-size:11px;color:var(--faint);letter-spacing:.04em;pointer-events:none}
.gov b{color:var(--coral-d);font-family:var(--serif);font-style:italic}
.searchwrap{position:absolute;right:14px;top:12px}
.searchwrap input{font-family:var(--sans);font-size:12px;padding:6px 11px;border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink);width:150px}
.sresults{position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.25);max-height:240px;overflow:auto;width:230px;display:none;z-index:5}
.sresults div{padding:7px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid #f0eee6}
.sresults div:hover{background:var(--coralwash)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-height:540px}
.ph{font-family:var(--serif);font-size:19px;margin:0 0 3px;line-height:1.2}
.psub{font-size:12px;color:var(--muted);margin-bottom:14px}
.badge{display:inline-block;font-size:11px;color:var(--coral-d);background:var(--coralwash);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle}
.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--coral);background:var(--coralwash)}
.chip .w{font-family:var(--serif);font-style:italic;color:var(--coral-d);font-size:11px}
.chip .tg{width:8px;height:8px;border-radius:50%}
.tag{font-size:11px;border-radius:7px;padding:3px 9px}
.tag.chain{color:var(--slate);background:#EFF2F4;border:1px solid #DCE3E6}
.tag.intent{color:#5b6a49;background:#F1F4EC;border:1px solid #DEE4D4}
.tag.supply{color:var(--taupe);background:#F2F0E9;border:1px solid var(--line)}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.kv b{color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);background:#fff;border-left:3px solid var(--coral);padding:9px 12px;border-radius:0 8px 8px 0;margin-top:10px}
.modgrp{margin-bottom:10px}.modgrp .mh{font-size:10px;color:var(--faint);letter-spacing:.05em;margin:8px 0 5px}
.dchip{font-size:11.5px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;transition:all .12s;display:inline-block;margin:0 4px 4px 0}
.dchip:hover{border-color:var(--coral);background:var(--coralwash)}.dchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;padding-right:3px;margin-top:4px}
.prow{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--coral);border-radius:8px;padding:8px 11px;cursor:pointer}
.prow:hover{border-color:var(--coral);box-shadow:0 4px 14px -8px rgba(166,81,47,.4)}
.prow .pn{font-size:12.5px;font-weight:500;line-height:1.3}
.prow .pm{font-size:10.5px;color:var(--muted);margin-top:2px}
.back{font-size:12px;color:var(--coral-d);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:10px}
.back:hover{text-decoration:underline}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.dt{width:9px;height:9px;border-radius:50%}
.foot{font-size:11px;color:var(--faint);margin-top:12px}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:#fff;font-size:11.5px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .08s;max-width:220px;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
@media(max-width:1000px){.stage{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

</div>

 cv.style.height=H+"px";cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);

function rot(v){
 // yaw around Y
 let x=v[0]*Math.cos(yaw)+v[2]*Math.sin(yaw);
 let z=-v[0]*Math.sin(yaw)+v[2]*Math.cos(yaw);
 let y=v[1];
 // pitch around X
 let y2=y*Math.cos(pitch)-z*Math.sin(pitch);
 let z2=y*Math.sin(pitch)+z*Math.cos(pitch);
 return [x,y2,z2];
}
function frame(){
 if(auto&&!dragging){yaw+=vel;}
 ctx.clearRect(0,0,W,H);
 const pts=[];
 for(const p of D.projects){const r=rot(p.v);pts.push({p,x:CXp+r[0]*RAD,y:CYp-r[1]*RAD,z:r[2]});}
 pts.sort((a,b)=>a.z-b.z);
 proj2d=pts;
 const filtering=(selDom!==null)||(selProj!==null);
 for(const o of pts){const t=(o.z+1)/2; // 0 back .. 1 front
   let base=chainColor[o.p.pchain]||"#928B7C";
   let r=1.2+t*2.6, a=0.22+t*0.72;

   ctx.globalAlpha=a;ctx.fillStyle=base;

}

function spinTo(v){const tx=-Math.atan2(v[0],v[2]);const ty=Math.asin(Math.max(-1,Math.min(1,v[1])));
 const sy=yaw,sp=pitch;let ny=tx;while(ny-sy>Math.PI)ny-=2*Math.PI;while(ny-sy<-Math.PI)ny+=2*Math.PI;
 const t0=performance.now();auto=false;

   yaw=sy+(ny-sy)*e;pitch=sp+(ty-sp)*e;if(k<1)requestAnimationFrame(an);}requestAnimationFrame(an);}

function renderHome(){
 panel.innerHTML=`<div class="ph">能力域 ↔ 政策</div>
 <div class="psub">这颗星球把 700 个政策项目和 26 个能力域连在一起。两种看法：点球面上的点，看一个政策连着哪些能力域；或点下面的能力域，让相关政策在球上亮起。</div>
 <div class="sect">从能力域出发（点击高亮相关政策）</div>
 ${D.modules.map(m=>{const ds=D.domains.filter(d=>d.module===m);return `<div class="modgrp"><div class="mh">${m}</div>${ds.map(d=>`<span class="dchip" data-c="${d.code}">${d.name}<span style="color:var(--faint);font-size:10px"> ${projByDom[d.code].length}</span></span>`).join("")}</div>`;}).join("")}`;
 panel.querySelectorAll(".dchip").forEach(c=>c.onclick=()=>selectDomain(c.dataset.c));
}
function renderDomain(code){const d=domByCode[code];const list=projByDom[code].map(id=>projById[id]);
 panel.innerHTML=`<div class="back" id="bk">← 返回</div>
 <div class="ph">${d.name}<span class="badge">${list.length} 个政策</span></div>
 <div class="psub">${d.module} · 政策链「${d.chain}」 · 球面上高亮的点都连接这个能力域</div>
 <div class="sect">连接该能力域的政策（点击聚焦到球上）</div>
 <div class="plist">${list.map(p=>`<div class="prow" data-id="${p.id}"><div class="pn">${p.n}</div><div class="pm">${p.cat} · ${p.val} · ${p.tool}</div></div>`).join("")}</div>`;
 panel.querySelector("#bk").onclick=goHome;
 panel.querySelectorAll(".prow").forEach(r=>r.onclick=()=>selectProject(r.dataset.id));
}
function renderProject(p){
 panel.innerHTML=`<div class="back" id="bk">← 返回</div>
 <div class="ph">${p.n}</div>
 <div class="psub">${p.cat}</div>
 <div class="kv"><span>含金量 <b>${p.val}</b></span></div>
 <div class="sect">连接的能力域（权重，点击看该能力域）</div>
 <div class="chips">${p.caps.map(([c,w])=>`<span class="chip" data-c="${c}"><span class="tg" style="background:${chainColor[domByCode[c].chain]||'#928B7C'}"></span>${domByCode[c].name}<span class="w">×${w}</span></span>`).join("")}</div>
 <div class="sect">政策链</div><div class="chips">${p.chains.map(c=>`<span class="tag chain">${c}</span>`).join("")}</div>
 <div class="sect">政策意图</div><div class="chips">${p.intents.map(i=>`<span class="tag intent">${i}</span>`).join("")}</div>
 <div class="sect">供给侧</div><div class="chips"><span class="tag supply">${p.line}</span><span class="tag supply">${p.tool}</span></div>
 <div class="psub" style="margin-top:14px">球上高亮的点=与本政策<b>共享能力域</b>的其它政策（共 ${hi.size-1} 个）。</div>`;
 panel.querySelector("#bk").onclick=goHome;
 panel.querySelectorAll(".chip[data-c]").forEach(c=>c.onclick=()=>selectDomain(c.dataset.c));
}
// 搜索
const q=document.getElementById("q"),sr=document.getElementById("sr");
q.addEventListener("input",()=>{const s=q.value.trim();if(!s){sr.style.display="none";return;}
 const hits=D.projects.filter(p=>p.n.includes(s)).slice(0,40);
 sr.innerHTML=hits.map(p=>`<div data-id="${p.id}">${p.n}</div>`).join("")||'<div style="color:var(--faint)">无匹配</div>';
 sr.style.display="block";sr.querySelectorAll("div[data-id]").forEach(d=>d.onclick=()=>{selectProject(d.dataset.id);sr.style.display="none";q.value="";});
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))sr.style.display="none";});
// legend
document.getElementById("legend").innerHTML=Object.entries(chainColor).map(([n,c])=>`<span><span class="dt" style="background:${c}"></span>${n}</span>`).join("");
// init
resize();renderHome();frame();
</script></body></html>
